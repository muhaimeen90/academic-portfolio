name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages on this repo serves from the `gh-pages` branch, so the workflow builds
# the static export and commits it there. That needs contents:write and nothing
# else — notably it does not require the repo's Pages source to be switched to
# "GitHub Actions", which the default token is not permitted to do.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      # `out/` is gitignored on main, so publish it as the whole tree of an
      # orphan commit on gh-pages — each deploy replaces the previous one.
      - name: Publish to gh-pages
        run: |
          set -euo pipefail
          touch out/.nojekyll
          cd out
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy ${GITHUB_SHA::7}"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
